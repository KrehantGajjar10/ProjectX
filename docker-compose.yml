services:
  postgres:
    image: postgres:17-alpine
    container_name: projectx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-projectx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectx} -d ${POSTGRES_DB:-projectx}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: projectx_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: projectx_neo4j
    restart: unless-stopped
    profiles:
      - optional
      - neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/projectx_secret}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
