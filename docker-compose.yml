services:
  postgres:
    image: postgres:17-alpine
    container_name: projectx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-projectx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectx} -d ${POSTGRES_DB:-projectx}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: projectx_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectx_api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-projectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-projectx}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projectx}:${POSTGRES_PASSWORD:-projectx_secret}@postgres:5432/${POSTGRES_DB:-projectx}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      STORAGE_DIR: /app/data/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:-}
    volumes:
      - app_storage:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectx_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.ingestion_worker"]
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-projectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-projectx}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projectx}:${POSTGRES_PASSWORD:-projectx_secret}@postgres:5432/${POSTGRES_DB:-projectx}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      STORAGE_DIR: /app/data/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:-}
    volumes:
      - app_storage:/app/data/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    container_name: projectx_neo4j
    restart: unless-stopped
    profiles:
      - optional
      - neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/projectx_secret}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  app_storage:
    driver: local
