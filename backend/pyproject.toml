[project]
name = "projectx-backend"
version = "0.1.0"
description = "ProjectX Backend - Capture. Understand. Handover."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.2",
    "neo4j>=5.26.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.12",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.12.0",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.23.1",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q -ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (needed for fastapi Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
